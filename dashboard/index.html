<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCP vs UTCP | Evidence dashboard</title><style>body{font:16px system-ui;background:#f8fafc;color:#172554;max-width:960px;margin:auto;padding:32px}section{background:white;border:1px solid #cbd5e1;border-radius:16px;padding:24px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #ddd}a{color:#2563eb}small{color:#475569}</style><h1>MCP vs UTCP</h1><p>Engineering Lab · Evidence dashboard</p><section><h2>Architecture</h2><img src="../docs/assets/architecture.svg" alt="MCP and UTCP architecture" style="width:100%"></section><section><h2>Measured results</h2><p>Import summary.json from the <a href="https://github.com/davidop/mcp-vs-utcp-demo/actions/workflows/benchmark.yml">benchmark workflow</a>.</p><input type="file" id="file" accept=".json"><p id="status" role="status">No verified results loaded.</p><table><thead><tr><th>Protocol</th><th>Attempts</th><th>Failures</th><th>p50 (ms)</th><th>p95 (ms)</th></tr></thead><tbody id="rows"></tbody></table><small>Imported results are user-provided; verify provenance against CI artifacts. No simulated data.</small></section><script>document.getElementById('file').onchange=async e=>{const rows=document.getElementById('rows'),status=document.getElementById('status');rows.replaceChildren();try{const d=JSON.parse(await e.target.files[0].text());for(const name of ['MCP','UTCP']){const x=d[name];if(!x)throw Error('Missing '+name);for(const k of ['attempts','failures','p50_ms','p95_ms'])if(x[k]!==null&&(!Number.isFinite(x[k])||x[k]<0))throw Error('Invalid '+k);const tr=rows.insertRow();for(const v of [name,x.attempts,x.failures,x.p50_ms,x.p95_ms])tr.insertCell().textContent=v===null?'N/A':typeof v==='number'?Number(v.toFixed(3)):v;}status.textContent='Imported results — provenance not independently verified.'}catch(err){rows.replaceChildren();status.textContent=err.message}};</script></html>

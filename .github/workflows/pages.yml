name: Publish engineering lab
# Pages source configured; trigger deployment validation.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Slidev
        working-directory: slides
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base /mcp-vs-utcp-demo/slides/
          test -s dist/index.html
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate measured evidence
        run: |
          pip install -c constraints-ci.txt -r requirements-mcp.txt -r requirements-utcp.txt && python -m pip check
          docker compose up --build -d
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          python -m http.server 8090 --bind 127.0.0.1 --directory manuals >/tmp/manual.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/inventory.json; then break; fi
            sleep 1
          done
          mkdir -p results
          git rev-parse HEAD > results/commit.txt
          uname -a > results/environment.txt
          pip freeze > results/dependencies.txt
          python benchmarks/run.py > results/samples.jsonl
          python benchmarks/aggregate.py results/samples.jsonl > results/summary.json
          python benchmarks/cold.py > results/cold-samples.jsonl
          python benchmarks/aggregate.py results/cold-samples.jsonl > results/cold-summary.json
      - name: Audit evidence before publication
        run: python benchmarks/audit_samples.py
      - name: Assemble static site
        run: |
          mkdir -p site/dashboard site/docs/assets site/slides
          cp dashboard/index.html site/dashboard/
          cp -r results site/dashboard/evidence
          cp docs/assets/architecture.svg site/docs/assets/
          cp -r slides/dist/. site/slides/
          printf '<!doctype html><html lang="en"><meta charset="utf-8"><title>Engineering Lab</title><h1>MCP vs UTCP</h1><a href="dashboard/">Evidence dashboard</a> · <a href="slides/">Slides</a></html>' > site/index.html
          test -s site/dashboard/index.html
          test -s site/docs/assets/architecture.svg
      - name: Check dashboard JavaScript syntax
        run: |
          python -c 'import re,pathlib; s=pathlib.Path("site/dashboard/index.html").read_text(); pathlib.Path("/tmp/dashboard.js").write_text(re.search(r"<script>(.*?)</script>",s,re.S).group(1))'
          node --check /tmp/dashboard.js
      - name: Preserve independently built site
        uses: actions/upload-artifact@v4
        with:
          name: engineering-lab-site
          path: site
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment

name: Warm and cold invocation benchmark
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -c constraints-ci.txt -r requirements-mcp.txt -r requirements-utcp.txt && python -m pip check
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: |
          mkdir -p results
          python -m http.server 8090 --bind 127.0.0.1 --directory manuals >/tmp/manual.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/inventory.json >/dev/null; then break; fi
            sleep 1
          done
          git rev-parse HEAD > results/commit.txt
          uname -a > results/environment.txt
          pip freeze > results/dependencies.txt
          status=0
          python benchmarks/run.py > results/samples.jsonl || status=$?
          python benchmarks/aggregate.py results/samples.jsonl > results/summary.json
          python benchmarks/cold.py > results/cold-samples.jsonl || status=$?
          python benchmarks/aggregate.py results/cold-samples.jsonl > results/cold-summary.json || status=$?
          exit "$status"
      - name: Independently audit raw benchmark samples
        run: |
          python - <<'PY'
          import json, math, statistics
          from pathlib import Path
          for prefix, count in [("", 100), ("cold-", 20)]:
              rows = [json.loads(line) for line in Path(f"results/{prefix}samples.jsonl").read_text().splitlines()]
              assert len(rows) == 2 * count
              report = json.loads(Path(f"results/{prefix}summary.json").read_text())
              for i in range(count):
                  pair = rows[2*i:2*i+2]
                  assert [r["protocol"] for r in pair] == (["MCP", "UTCP"] if i % 2 == 0 else ["UTCP", "MCP"])
                  assert all(r["iteration"] == i for r in pair)
              for protocol in ("MCP", "UTCP"):
                  samples = [r for r in rows if r["protocol"] == protocol]
                  assert all(r["ok"] is True and r["error"] is None for r in samples)
                  values = [r["elapsed_ms"] for r in samples]
                  assert all(math.isfinite(v) and v >= 0 for v in values)
                  expected = report[protocol]
                  assert expected["attempts"] == count and expected["failures"] == 0
                  assert math.isclose(expected["p50_ms"], statistics.median(values))
                  assert math.isclose(expected["p95_ms"], sorted(values)[math.ceil(.95*count)-1])
              print(f"Audited {len(rows)} {prefix or 'warm'} raw samples successfully")
          PY
      - name: Publish measured summaries to job log
        if: always()
        run: |
          for f in results/commit.txt results/summary.json results/cold-summary.json; do
            if test -f "$f"; then
              echo "=== $f ==="
              cat "$f"
            fi
          done
          {
            echo '## Measured benchmark results'
            for f in results/summary.json results/cold-summary.json; do
              if test -f "$f"; then
                echo "### $f"
                echo '~~~json'
                cat "$f"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence
          path: results/
      - if: always()
        run: docker compose down

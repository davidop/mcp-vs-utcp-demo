name: Warm and cold invocation benchmark
on: [workflow_dispatch, push, pull_request]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-mcp.txt -r requirements-utcp.txt
      - run: docker compose up --build -d
      - run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: |
          mkdir -p results
          python -m http.server 8090 --bind 127.0.0.1 --directory manuals >/tmp/manual.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8090/inventory.json >/dev/null; then break; fi
            sleep 1
          done
          git rev-parse HEAD > results/commit.txt
          uname -a > results/environment.txt
          pip freeze > results/dependencies.txt
          status=0
          python benchmarks/run.py > results/samples.jsonl || status=$?
          python benchmarks/aggregate.py results/samples.jsonl > results/summary.json
          python benchmarks/cold.py > results/cold-samples.jsonl || status=$?
          python benchmarks/aggregate.py results/cold-samples.jsonl > results/cold-summary.json || status=$?
          exit "$status"
      - name: Publish measured summaries to job log
        if: always()
        run: |
          for f in results/commit.txt results/summary.json results/cold-summary.json; do
            if test -f "$f"; then
              echo "=== $f ==="
              cat "$f"
            fi
          done
          {
            echo '## Measured benchmark results'
            for f in results/summary.json results/cold-summary.json; do
              if test -f "$f"; then
                echo "### $f"
                echo '~~~json'
                cat "$f"
                echo '~~~'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-evidence
          path: results/
      - if: always()
        run: docker compose down
